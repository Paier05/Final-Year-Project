# Issue #9 — evo-harness on ls20, Level 1, Qwen3.8-27B.
#
# Credentials are NOT here. The endpoint URL and key are read from the
# QWEN_BASE_URL and QWEN_API_KEY environment variables (or the gitignored
# .env), and are never written to logs, archive.json or reports.

game: "ls20-9607627b"
# Level-1 human baseline for ls20: the arc-agi toolkit's
# EnvironmentInfo.baseline_actions[0] (recorded in #8's results/games.json,
# PR #10). Used only in the score.
human_baseline_actions: 22

rounds: 5
# Decided with the user on 2026-11-01 (the issue left these TBD).
episodes_per_round: 3
# The three episodes of a version run at the same time. ls20 is seed-
# independent, so parallel episodes are independent samples of one level.
parallel_episodes: 3

gate:
  # accept iff mean(child) - mean(parent) > 0
  #        and worst(parent) - worst(child) <= delta
  delta: 0.1

player:
  model: "Qwen/Qwen3.8-27B-FP8"
  temperature: 0.2
  top_p: 0.9
  # #8 used 600 for a JSON action. A turn here is up to 6 short reasoning
  # lines plus a code cell, so it needs more room; measured in the pilot.
  max_tokens: 1500
  # Same as #8, for the same measured reason (3.7x faster, 5x fewer output
  # tokens, cleaner format than reasoning_effort "low").
  thinking: "off"
  request_timeout_s: 180
  max_transient_retries: 2

meta:
  # Optional in the issue; on, because the report must split Meta-LLM edits
  # from rule-based ones.
  enabled: true
  model: "Qwen/Qwen3.8-27B-FP8"
  temperature: 0.3
  top_p: 0.9
  max_tokens: 8000
  thinking: "off"
  request_timeout_s: 600
  max_transient_retries: 2
  # Edits per round from the Meta LLM. Small, so a gate decision can still be
  # attributed to something.
  max_edits: 4

budget:
  # The issue's "step budget per episode": 200 game actions (= #8).
  max_actions: 200
  # The "6-step turn": one LLM call per turn, at most 6 actions per cell.
  actions_per_turn: 6
  # Turns may take 0 actions (looking, computing). The turn cap equals the
  # action budget, so the per-episode LLM-call ceiling is the same as #8's.
  max_turns: 200
  wall_clock_s: 5400
  max_tokens_per_episode: 1200000
  max_resets: 10
  cell_time_limit_s: 10

observation:
  max_objects: 40
  history_n: 10

rules:
  # Promote an inline helper to a skill when the player wrote it in this many
  # episodes, or called it this many times.
  promote_min_episodes: 2
  promote_min_calls: 6
  max_promotions: 3
  # Delete a skill never called in this many evaluated episodes.
  delete_min_episodes: 6

validate:
  max_system_chars: 14000
  max_prompt_chars: 3000
  min_steps: 3
  max_steps: 10
  max_step_chars: 400
  max_skill_lines: 80
  # Where skill test snippets run: real states at these fractions of the
  # longest parent episode, rebuilt by replaying its logged actions.
  test_state_fractions: [0.0, 0.5, 0.9]

limits:
  # Whole-run ceiling, checked before every round. 6 versions x 3 episodes x
  # 1.2M per-episode cap = 21.6M worst case, plus Meta LLM calls.
  global_token_cap: 25000000
  abort_after_consecutive_rate_limits: 3
